name: SEO Bot (manual draft → review PR)

# Institutional editorial policy: manual dispatch only, at most two inert drafts
# weekly including open review PRs. No public MDX, auto-commit to main or IndexNow.
# A review PR does not authorize publication; follow the explicit release runbook.

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "Only blogPost is active; requires an explicit unprepared assignment"
        required: false
      dryRun:
        description: "Dry run (generate nothing, simulate only)"
        type: boolean
        default: false

# Note: no `schedule:` block. Autonomous daily generation is intentionally off.

concurrency:
  group: seo-bot-manual-drafts
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Run SEO bot in review mode
        env:
          REQUESTED_TASKS: ${{ github.event.inputs.tasks }}
          DRY_RUN: ${{ github.event.inputs.dryRun }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Never pass --publish here. Review mode leaves drafts uncommitted in
          # the working tree; the next step opens a PR for a human to review.
          if [ "$DRY_RUN" = "true" ]; then
            npx tsx scripts/seo-bot/cli.ts daily --dry-run
          elif [ -n "$REQUESTED_TASKS" ]; then
            npx tsx scripts/seo-bot/cli.ts daily --tasks "$REQUESTED_TASKS"
          else
            npx tsx scripts/seo-bot/cli.ts daily
          fi
      - name: Open review pull request
        if: ${{ github.event.inputs.dryRun != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: seo-bot
          GIT_AUTHOR_EMAIL: seo-bot@prestyj.com
          GIT_COMMITTER_NAME: seo-bot
          GIT_COMMITTER_EMAIL: seo-bot@prestyj.com
        run: |
          set -e
          # Only proceed if the bot actually drafted something.
          if [ -z "$(git status --porcelain scripts/seo-bot/output/drafts/)" ]; then
            echo "No drafts generated — nothing to review."
            exit 0
          fi
          BRANCH="seo-bot/drafts-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add scripts/seo-bot/output/drafts/ scripts/seo-bot/output/reports/
          git commit -m "seo-bot: drafts for human review (do not merge without review)"
          git push origin "$BRANCH"
          gh pr create \
            --title "SEO bot drafts for human review — $(date -u +%Y-%m-%d)" \
            --body "Inert Markdown drafts only. Merging does not publish them. Review sources and controls, then follow the explicit promotion runbook. Two drafts weekly maximum, including open draft PRs. No IndexNow until separately authorized deployment and live verification." \
            --base main \
            --head "$BRANCH" \
            --label "needs-human-review"
      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-bot-reports-${{ github.run_id }}
          path: |
            scripts/seo-bot/output/reports/
            scripts/seo-bot/output/drafts/
          retention-days: 30
